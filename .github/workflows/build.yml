name: Build and CPU players
on: [push, pull_request]
jobs:
  windows-physics:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m unittest discover -s tests -v
      - run: |
          $pythonExe = (Get-Command python).Source
          cmake -S physics -B build/physics-x64 -A x64 -DWULFRAM_PHYSICS_BUILD_TESTS=OFF "-DPython3_EXECUTABLE=$pythonExe"
      - run: cmake --build build/physics-x64 --config Release --parallel 2
      - run: python -c "import sys; sys.path.insert(0, 'build/physics-x64/Release'); import _wulfram_physics as p; assert p.api_version() == 14"
      - uses: actions/upload-artifact@v4
        with:
          name: wulfram-physics-windows-x64-python313
          if-no-files-found: error
          path: |
            build/physics-x64/Release/*.pyd
            build/physics-x64/Release/WulframPhysicsC.dll
  windows-display:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S client/windows -B build/windows-display -A Win32
      - run: cmake --build build/windows-display --config Release
      - run: ctest --test-dir build/windows-display -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: wulfram-display-windows-x86
          path: build/windows-display/Release/wulfram-display.exe
  linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: cmake -S physics -B build/physics-linux-x64 -DCMAKE_BUILD_TYPE=Release -DWULFRAM_PHYSICS_BUILD_TESTS=OFF
      - run: cmake --build build/physics-linux-x64 --parallel 2
      - run: sha256sum build/physics-linux-x64/*.so > build/physics-linux-x64/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wulfram-physics-${{ matrix.arch }}-python313
          if-no-files-found: error
          path: |
            build/physics-linux-x64/*.so
            build/physics-linux-x64/SHA256SUMS
